name: Fly Deploy
on:
  push:
    branches:
      - '**'
    paths:
      - /**
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        run: go get .      
      - name: Build
        run: go build -v ./...
      - name: Test with the Go CLI
        run: go test      
        
